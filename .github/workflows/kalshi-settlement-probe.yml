name: kalshi-settlement-basis-smoke
# Strict exhaustive-partition validation enabled.

on:
  push:
    branches:
      - research/settlement-source-audit
    paths:
      - ".github/workflows/kalshi-settlement-probe.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compare NWS CLI against Kalshi settlements
        run: |
          python -m historical.settlement_basis \
            --start 2021-08-01 \
            --end 2026-10-02 \
            --output /tmp/settlement-basis.json
