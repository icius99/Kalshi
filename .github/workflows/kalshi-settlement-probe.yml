name: kalshi-settlement-probe

on:
  push:
    branches:
      - research/settlement-source-audit
    paths:
      - ".github/workflows/kalshi-settlement-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m historical.probe_kalshi_settlements
