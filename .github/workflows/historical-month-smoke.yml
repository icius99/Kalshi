name: historical-month-smoke

on:
  push:
    branches:
      - research/historical-dataset-audit
    paths:
      - ".github/workflows/historical-month-smoke.yml"

jobs:
  september-2026:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build September 2026 history
        run: |
          python -m historical.build_nbm_history \
            --start 2026-09-01 \
            --end 2026-09-30 \
            --output /tmp/nbm-september.csv
      - name: Audit built dataset
        run: python -m historical.audit_dataset /tmp/nbm-september.csv
