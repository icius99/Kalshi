name: historical-full-smoke

on:
  push:
    branches:
      - research/historical-dataset-audit
    paths:
      - ".github/workflows/historical-month-smoke.yml"

jobs:
  multi-year-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build 2021-2026 history
        run: |
          python -m historical.build_nbm_history \
            --start 2021-01-01 \
            --end 2026-09-30 \
            --output /tmp/nbm-history.csv
      - name: Audit built dataset
        run: python -m historical.audit_dataset /tmp/nbm-history.csv
      - name: Fit baseline error model
        run: |
          python -m historical.forecast_error \
            /tmp/nbm-history.csv \
            --output /tmp/nbm-model.json
      - name: Chronological holdout validation
        run: |
          python -m historical.validate_chronological \
            /tmp/nbm-history.csv \
            --output /tmp/nbm-validation.json
