name: recent-price-backtest-smoke

on:
  push:
    branches:
      - research/historical-price-backtest
    paths:
      - ".github/workflows/recent-price-backtest-smoke.yml"

jobs:
  recent-holdout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build weather verification history
        run: |
          python -m historical.build_nbm_history \
            --start 2021-01-01 \
            --end 2026-10-02 \
            --output /tmp/nbm-history.csv
      - name: Run recent market-price holdout
        run: |
          python -m historical.price_backtest \
            /tmp/nbm-history.csv \
            --start 2026-08-05 \
            --end 2026-10-02 \
            --output /tmp/recent-price-backtest.json
