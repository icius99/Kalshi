name: price-history-probe
# Includes archived single-market response inspection.
on:
  push:
    branches: [research/historical-price-backtest]
    paths: [".github/workflows/price-history-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m historical.probe_price_history
