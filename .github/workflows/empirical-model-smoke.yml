name: empirical-model-smoke

on:
  push:
    branches:
      - research/empirical-error-model
    paths:
      - ".github/workflows/empirical-model-smoke.yml"

jobs:
  chronological-comparison:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalshi-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build historical verification set
        run: |
          python -m historical.build_nbm_history \
            --start 2021-01-01 \
            --end 2026-09-30 \
            --output /tmp/nbm-history.csv
      - name: Fit empirical model
        run: |
          python -m historical.forecast_error \
            /tmp/nbm-history.csv \
            --output /tmp/nbm-model.json
      - name: Compare chronological probability models
        run: |
          python -m historical.validate_chronological \
            /tmp/nbm-history.csv \
            --buckets 12,24,36,48,60 \
            --output /tmp/validation.json
